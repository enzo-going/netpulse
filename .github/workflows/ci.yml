name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: pytest
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npx oxlint

      # `npm run build` e tsc -b seguido de vite build: a checagem de tipos
      # falha o job antes de empacotar.
      - name: Checagem de tipos e build
        run: npm run build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validar Compose
        run: docker compose config --quiet

      - name: Construir imagem da demo
        run: docker build --tag netpulse:ci .

      # Construir a imagem nao prova que a demo funciona: o painel so e servido
      # se o build do front chegou ao lugar certo e se a API o monta. Aqui a
      # pilha sobe de verdade e o teste e o que a pessoa faria — abrir a pagina.
      - name: Subir a pilha
        run: docker compose up --detach --wait

      - name: A API responde
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/api/health

      - name: O painel e servido na mesma origem
        run: |
          pagina=$(curl --fail --silent --show-error http://127.0.0.1:8000/)
          echo "$pagina" | grep -q "<title>NetPulse</title>" \
            || { echo "a raiz nao devolveu o painel:"; echo "$pagina" | head -20; exit 1; }
          # O HTML sozinho nao basta: sem o bundle a tela abre em branco.
          bundle=$(echo "$pagina" | grep -oE '/assets/[^"]+\.js' | head -1)
          test -n "$bundle" || { echo "o HTML nao referencia bundle algum"; exit 1; }
          curl --fail --silent --show-error --output /dev/null "http://127.0.0.1:8000$bundle"

      - name: A demo abre com dados
        run: |
          resumo=$(curl --fail --silent --show-error http://127.0.0.1:8000/api/overview)
          echo "$resumo"
          # Uma demo que abre com o parque vazio nao demonstra nada.
          python -c "
          import json, sys
          d = json.loads(sys.argv[1])
          assert d['total_assets'] > 0, 'a demo subiu sem nenhum ativo'
          " "$resumo"

      - name: Diagnostico quando algo falha
        if: failure()
        run: docker compose logs --no-color --tail 60

      - name: Derrubar a pilha
        if: always()
        run: docker compose down --volumes
