[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netpulse"
version = "0.1.0"
description = "Monitoramento de ativos de rede com analise de incidentes assistida por IA"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Enzo Going" }]
dependencies = [
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.52.4",
    "typer>=0.15",
    "rich>=15.0.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
snmp = ["pysnmp>=7.1.29"]
ai = ["anthropic>=1.5.0"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.7",
]

[project.scripts]
netpulse = "netpulse.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["netpulse"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI e Typer declaram metadados chamando funcoes no valor padrao do
# parametro; e o uso pretendido dessas bibliotecas, nao o bug que o B008 procura.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "typer.Argument",
    "typer.Option",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
